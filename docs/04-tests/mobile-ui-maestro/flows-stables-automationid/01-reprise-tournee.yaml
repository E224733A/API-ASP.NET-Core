appId: fr.sli.mobiletournee
---
# MUI-001 - Reprise d'une tournée non synchronisée avec AutomationId
#
# Précondition :
# - une tournée locale non synchronisée existe déjà ;
# - l'écran de confirmation de tournée est affiché ;
# - les AutomationId recommandés sont ajoutés dans l'application mobile.

- launchApp
- assertVisible:
    id: "page_confirmation_tournee"
- tapOn:
    id: "btn_charger_tournee"
- assertVisible:
    id: "panel_tournee_non_synchronisee"
- assertVisible:
    id: "btn_reprendre_tournee"
- tapOn:
    id: "btn_reprendre_tournee"
- assertVisible:
    id: "page_points_livraison"
