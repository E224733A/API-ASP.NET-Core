appId: fr.sli.mobiletournee
---
# MUI-002 - Saisie ROLLS_VIDES dans la colonne Livré
#
# Précondition :
# - une tournée est déjà chargée localement ;
# - l'écran "Points de livraison" est accessible au lancement ;
# - le premier point ouvert contient l'article "Rolls vides" ou "Chariots vides" ;
# - le champ Livré des chariots vides est éditable.
#
# Remarque : sans AutomationId, la saisie dans un Entry précis peut dépendre de la position à l'écran.
# La variante stable est disponible dans flows-stables-automationid.

- launchApp
- assertVisible: "Points de livraison"
- tapOn: "Ouvrir"
- assertVisible: "Détail point"
- assertVisible: "Livré"
- assertVisible: "Récupéré"
- assertVisible: ".*(Rolls vides|Chariots vides).*"
- tapOn:
    point: "62%,42%"
- inputText: "3"
- hideKeyboard
- tapOn: "Valider le passage"
- assertVisible: ".*(Tournée|Points de livraison|Détail point|validé|enregistré).*"
