appId: fr.sli.mobiletournee
---
# MUI-001 - Reprise d'une tournée non synchronisée
#
# Précondition :
# - une tournée locale non synchronisée existe déjà sur le téléphone ;
# - l'application est positionnée sur l'écran de confirmation de tournée ;
# - une tournée est déjà sélectionnée ;
# - le bouton "Charger la tournée" est visible.
#
# Variante texte : utile pour démarrer rapidement, mais moins robuste qu'une variante AutomationId.

- launchApp
- assertVisible: "Choix de la tournée"
- assertVisible: "Charger la tournée"
- tapOn: "Charger la tournée"
- assertVisible: ".*tournée non synchronisée.*"
- assertVisible: ".*Reprendre.*"
- tapOn: ".*Reprendre.*"
- assertVisible: "Points de livraison"
